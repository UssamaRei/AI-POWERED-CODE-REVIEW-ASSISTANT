name: 'AI Code Review Assistant'
description: 'AI-powered code review that analyzes PR diffs structurally and posts inline comments using free LLM APIs (Gemini/Groq)'
author: 'ussamarei'

branding:
  icon: 'code'
  color: 'blue'

inputs:
  gemini_api_key:
    description: 'Google Gemini API key (AI Studio free tier)'
    required: true
  groq_api_key:
    description: 'Groq API key for fallback (optional, free tier)'
    required: false
    default: ''
  review_language:
    description: 'Programming language(s) to review: all (default), or comma-separated e.g. java,cs,python,ts'
    required: false
    default: 'all'
  severity_threshold:
    description: 'Minimum severity to post as comments (CRITICAL, WARNING, SUGGESTION, NITPICK)'
    required: false
    default: 'SUGGESTION'
  max_files:
    description: 'Maximum number of changed files to review per PR'
    required: false
    default: '15'
  github_token:
    description: 'GitHub token for API access (defaults to github.token when passed via env or input)'
    required: false
    default: ''

runs:
  using: 'docker'
  image: 'Dockerfile'
