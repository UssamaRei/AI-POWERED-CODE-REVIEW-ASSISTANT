name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Run Tests
        run: mvn clean verify -B

      - name: Build Docker Image
        run: docker build -t ai-code-review-assistant:test .

      - name: Verify Docker Image
        run: |
          # Ensure the JAR is present and the JVM starts
          docker run --rm ai-code-review-assistant:test java -version
          echo "Docker image built and verified successfully"
